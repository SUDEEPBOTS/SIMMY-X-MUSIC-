version: '3.8'

services:
  simmymusic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simmymusic_engine
    restart: always
    env_file:
      - .env
    volumes:
      - ./downloads:/app/downloads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
